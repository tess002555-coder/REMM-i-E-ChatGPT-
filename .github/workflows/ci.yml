name: REMM V2 CI

on:
  push:
    branches: [ main, master, v2-rebuild ]
  pull_request:
    branches: [ main, master, v2-rebuild ]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Check TypeScript
        run: npm run lint

      - name: Build Web App
        run: npm run build
