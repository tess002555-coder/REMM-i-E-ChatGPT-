name: Build Remember ME V2 Windows EXE

on:
  push:
    branches: [ v3-clean-widget ]
  pull_request:
    branches: [ v3-clean-widget ]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        shell: pwsh
        run: npm install --include=optional --no-audit --no-fund

      - name: TypeScript and Vite build
        run: npm run build

      - name: Build Tauri Desktop App (.exe)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis
          tagName: v0.1.0-build-${{ github.run_number }}
          releaseName: 'Remember ME V2 Build #${{ github.run_number }}'
          releaseBody: 'Clean native floating mascot widget with separate task panel.'
          releaseDraft: true
          prerelease: true

      - name: Verify generated EXE
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue
          if (-not $files) {
            Write-Error "No NSIS .exe was generated."
            exit 1
          }
          $files | ForEach-Object { Write-Host "Generated: $($_.FullName)" }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RememberME-V2-Windows-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
