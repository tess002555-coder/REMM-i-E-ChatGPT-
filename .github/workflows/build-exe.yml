name: Build Windows EXE (Tauri)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install npm dependencies
        shell: pwsh
        run: |
          # Tailwind CSS v4 uses @tailwindcss/oxide with platform-specific
          # optional native packages. npm ci can fail to restore these optional
          # dependencies on the Windows runner, so rebuild node_modules from
          # package.json instead of using the existing lockfile.
          if (Test-Path node_modules) { Remove-Item -Recurse -Force node_modules }
          if (Test-Path package-lock.json) { Remove-Item -Force package-lock.json }
          npm install --legacy-peer-deps --include=optional

      - name: Build Tauri Desktop App (.exe)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.0.0-build-${{ github.run_number }}
          releaseName: 'Remember ME v1.0.0 (Build #${{ github.run_number }})'
          releaseBody: 'File Executable Windows (.exe) buatan otomatis oleh GitHub Actions.'
          releaseDraft: true
          prerelease: false

      - name: Verify generated EXE
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue
          if (-not $files) {
            Write-Error "No NSIS .exe was generated."
            exit 1
          }
          $files | ForEach-Object { Write-Host "Generated: $($_.FullName)" }

      - name: Upload Build Artifacts (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: RememberME-Windows-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
