name: Build REMM(i) C# WPF

on:
  push:
    branches:
      - csharp-wpf
  workflow_dispatch:

jobs:
  build-csharp:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build .\REMM-i-WPF\REMM-i-WPF.csproj -c Release --no-restore

      - name: Publish self-contained EXE
        run: >-
          dotnet publish .\REMM-i-WPF\REMM-i-WPF.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path .\REMM-i-WPF\bin\Release\net8.0-windows\win-x64\publish -Filter "REMM-i.exe" -File
          if (-not $exe) { throw "REMM-i.exe was not generated." }
          Write-Host "Generated: $($exe.FullName)"
          Write-Host "Size: $($exe.Length) bytes"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: REMM-i-CSharp-WPF-win-x64
          path: .\REMM-i-WPF\bin\Release\net8.0-windows\win-x64\publish\REMM-i.exe
          if-no-files-found: error
