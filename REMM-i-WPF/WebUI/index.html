<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; img-src 'self' data: https://pose.local; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>REMM(i)E</title>
  <link rel="stylesheet" href="css/app.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <main id="mascot-view" class="mascot-view" aria-label="REMM(i)E mascot">
    <div id="mascot-orb" class="mascot-orb" data-pose="peek">
      <img id="mascot-image" src="assets/mascot.png" alt="Mascot REMM(i)E" draggable="false">
      <span class="mascot-spark spark-one" aria-hidden="true">✦</span>
      <span class="mascot-spark spark-two" aria-hidden="true">✧</span>
      <button class="mascot-mode" type="button" data-action="mascot.toggle" aria-label="Ganti mode mascot" title="Ganti mode">↔</button>
    </div>
  </main>

  <main id="panel-view" class="panel-view" aria-label="REMM(i)E productivity panel">
    <header class="topbar" data-drag-handle>
      <div class="brand-lockup">
        <img src="assets/mascot.png" alt="" class="brand-avatar">
        <div><strong id="project-name">REMM(i)E</strong><span id="display-name">Ruang produktivitasmu</span></div>
      </div>
      <label class="global-search"><span aria-hidden="true">⌕</span><input id="global-search" type="search" placeholder="Cari tugas, rutinitas, jadwal…" autocomplete="off" aria-label="Cari"></label>
      <div class="top-actions">
        <span id="today-label" class="today-label"></span>
        <button type="button" class="window-button" data-action="app.exit" aria-label="Keluar dari aplikasi" title="Keluar dari REMM(i)E">⏻</button>
        <button type="button" class="window-button" data-action="panel.close" aria-label="Tutup panel" title="Tutup">×</button>
      </div>
    </header>

    <div class="app-layout">
      <aside class="sidebar">
        <div class="sidebar-label">RUANG KERJA</div>
        <nav id="navigation" aria-label="Navigasi utama">
          <button class="nav-item active" data-page="dashboard"><span>⌂</span>Ringkasan</button>
          <button class="nav-item" data-page="tasks"><span>☑</span>Tugas</button>
          <button class="nav-item" data-page="routines"><span>↻</span>Rutinitas</button>
          <button class="nav-item" data-page="schedules"><span>◷</span>Jadwal</button>
          <button class="nav-item" data-page="calendar"><span>▦</span>Kalender</button>
        </nav>
        <div class="sidebar-spacer"></div>
        <button class="nav-item settings-link" data-page="settings"><span>⚙</span>Pengaturan</button>
        <div class="sidebar-footer"><span class="status-dot"></span><span id="connection-label">Menghubungkan data lokal…</span></div>
      </aside>

      <section class="page-shell">
        <div id="page-content" class="page-content" aria-live="polite">
          <div class="loading-state"><span class="loader"></span><p>Menyiapkan ruang kerjamu…</p></div>
        </div>
      </section>
    </div>

    <div id="modal-root"></div>
    <div id="toast-region" class="toast-region" aria-live="assertive"></div>
  </main>
</body>
</html>
