<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REMM(i)E</title><link rel="stylesheet" href="style.css"></head><body><main class="panel"><button class="drag-handle" id="drag"><span>•••</span><span>Pindah Panel</span></button><header class="header"><div class="avatar">R</div><div class="identity"><div class="brand">REMM(i)E</div><div class="name" id="displayName">Maskot Denia</div></div><div class="header-actions"><button data-action="settings">⚙</button><button data-action="close">×</button></div></header><label class="search"><span>⌕</span><input id="search" placeholder="Cari tugas / rutinitas..." autocomplete="off"></label><section class="card"><div class="card-head"><div class="title"><span class="cyan">▣</span> Calender</div><button class="add" data-action="add-calendar">+</button><button class="detail" data-action="calendar">Detail ›</button></div><div class="content" id="calendar"></div></section><section class="card"><div class="card-head"><div class="title">Rutinitas</div><button class="add" data-action="add-routine">+</button></div><div class="content" id="routines"></div></section><section class="card tasks-card"><div class="card-head"><div class="title">Tugas <span class="count" id="taskCount">0</span></div><button class="add" data-action="add-task">+</button></div><div class="filters"><button data-filter="Semua" class="active">Semua</button><button data-filter="Tinggi">● Tinggi</button><button data-filter="Sedang">● Sedang</button><button data-filter="Rendah">● Rendah</button></div><div class="content task-list" id="tasks"></div></section></main><script src="app.js"></script></body></html>
